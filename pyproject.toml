[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuairand-research-rec"
version = "0.1.0"
description = "Configurable KuaiRand-Pure recommender models for autonomous experimentation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agent = ["openai>=1.66"]

[project.scripts]
train-recommender = "research_rec.cli:main"
prepare-kuairand = "research_rec.prepare_cli:main"
run-kuairand-baseline = "research_rec.baseline_cli:main"
run-research-agent = "research_rec.agent_cli:main"
export-recommendations = "research_rec.predict_cli:main"
serve-research-console = "research_rec.demo_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
