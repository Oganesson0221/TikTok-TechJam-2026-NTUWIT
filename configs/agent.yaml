max_experiments: 6
walltime_hours: 4.0
convergence_epsilon: 0.0001
convergence_patience: 3
max_retries: 2
log_dir: artifacts/agent_run
candidates:
  - name: mf_control
    hypothesis: ID-only matrix factorization establishes the cheapest personalized control.
    config: configs/mf_baseline.yaml
  - name: deepfm_side_neg4
    hypothesis: Static user/video context and temporal features with second-order crosses improve click ranking.
    config: configs/deepfm_features.yaml
  - name: dcn_side_neg4
    hypothesis: Explicit deep cross layers capture higher-order user-context-item interactions better than DeepFM.
    config: configs/dcn_features.yaml
  - name: deepfm_side_all_negatives
    hypothesis: Keeping all logged negatives preserves calibration and may improve ranking versus 4-to-1 downsampling.
    config: configs/deepfm_features.yaml
    overrides:
      - data.negative_ratio=null
  - name: deepfm_embed32_neg4
    hypothesis: A wider embedding can represent high-cardinality user, video, author, and music interactions.
    config: configs/deepfm_features.yaml
    overrides:
      - model.embedding_dim=32
  - name: dcn_lr5e4
    hypothesis: A lower learning rate may stabilize the cross network after the initial architecture comparison.
    config: configs/dcn_features.yaml
    overrides:
      - training.learning_rate=0.0005

